<title>낱말 용사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column, boss on top, tiles at thumb height. Committed single dark
   theme - ink-wash night. Colors: 먹(ground), 한지(text), 인장 주홍(accent),
   금니(currency), 청자(positive). */
:root {
  --bg: #11131A;
  --surface: #1A1D27;
  --surface-2: #242838;
  --line: #333950;
  --fg: #ECEAE3;
  --fg-dim: #969BB3;
  --fg-faint: #656B85;
  --accent: #D6453A;
  --accent-soft: #3A1715;
  --gold: #C9A227;
  --jade: #4A9E8F;
  --danger: #E0683C;
  --font-display: "Gowun Batang", serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  margin: 0;
}
.wrap {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font-display); font-weight: 700; }
p { margin: 0; }
button { font-family: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- top status ---- */
.hud {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
}
.brand { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.brand .nm { font-family: var(--font-display); font-size: 19px; letter-spacing: .02em; }
.brand .lv {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  color: var(--gold); border: 1px solid #4A3E18; background: #241F0D;
  border-radius: 20px; padding: 1px 7px; white-space: nowrap;
}
.purse { display: flex; gap: 6px; }
.coin {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 3px 10px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
}
.coin i { font-style: normal; font-size: 11px; }
.coin.g { color: var(--gold); }
.coin.j { color: #7FD4E8; }

/* ---- boss ---- */
.arena {
  background: linear-gradient(180deg, #171A24 0%, #12141C 100%);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}
.arena::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 0%, rgba(214,69,58,.10), transparent 65%);
}
.stageline {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 11.5px; color: var(--fg-dim);
  font-family: var(--font-mono); letter-spacing: .06em;
}
.stageline .timer { font-size: 15px; font-weight: 600; color: var(--fg); }
.stageline .timer.low { color: var(--danger); }
.bossrow { display: flex; align-items: center; gap: 13px; }
/* 신수는 한지에 그린 그림이다. 어두운 먹색 UI 위에 족자처럼 걸린다.
   등급은 그림을 다시 그리는 게 아니라 필터와 테두리로만 구분한다. */
.portrait {
  width: 104px; height: 142px; flex: none; position: relative;
  border-radius: 8px; overflow: hidden; background: #E8E2D2;
  box-shadow: 0 0 0 1px #0007, 0 8px 22px -10px #000;
  transition: transform .09s ease, box-shadow .25s ease, filter .25s ease;
}
.portrait img, .portrait canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait canvas { background: #171A24; }
.portrait.hit { transform: translateX(-7px) scale(.95); }
.portrait.g-young { filter: grayscale(.3) opacity(.86); }
.portrait.g-angry { filter: contrast(1.2) saturate(1.5) brightness(.96); }
.portrait.g-guard { box-shadow: 0 0 0 2px var(--gold), 0 8px 28px -8px rgba(201,162,39,.75); }
.stageline b { color: var(--fg); font-size: 13px; font-weight: 600; }
.bossinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bossname { font-family: var(--font-display); font-size: 17px; }
.bossname small { font-family: var(--font-body); font-size: 11.5px; color: var(--fg-faint); margin-left: 6px; }
.hpbar { height: 13px; background: #0C0E14; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #B8332A, var(--accent)); width: 100%; transition: width .3s cubic-bezier(.2,.8,.3,1); }
.hpnum { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }
.floaters { position: absolute; inset: 0; pointer-events: none; }
.dmg {
  position: absolute; font-family: var(--font-mono); font-weight: 600;
  color: var(--gold); font-size: 20px; text-shadow: 0 2px 6px #000;
  animation: rise 1s ease-out forwards;
}
@keyframes rise { to { transform: translateY(-46px); opacity: 0 } }

/* ---- word slot ---- */
.slot {
  min-height: 56px;
  background: var(--surface); border: 1px dashed var(--line);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; flex-wrap: wrap;
}
.slot.ok { border-style: solid; border-color: var(--jade); background: #15241F; }
.slot .ph { color: var(--fg-faint); font-size: 13px; }
.syl {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 21px; font-weight: 700;
  background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 9px;
}
.slot .syl { background: #2C3142; }

/* ---- tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.tile {
  aspect-ratio: 1; width: 100%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(18px, 5.4vw, 23px); font-weight: 700;
  background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  transition: transform .08s ease, opacity .15s ease;
}
.tile:active { transform: scale(.92); }
.tile[disabled] { opacity: .22; }
.tile.used { opacity: .25; }

/* ---- actions ---- */
.acts { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 7px; }
.btn {
  border-radius: 11px; padding: 12px 8px;
  font-size: 14px; font-weight: 600;
  background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: var(--accent); color: #fff; border-color: transparent; }
.btn.go:disabled { background: var(--surface-2); color: var(--fg-faint); border-color: var(--line); }
.btn.go.ask { background: var(--surface-2); color: var(--gold); border-color: #4A3E18; }

.boardinfo {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-dim);
  padding: 0 2px; margin-top: -2px;
}
.boardinfo b { color: var(--jade); font-weight: 600; }
.mini {
  background: transparent; color: var(--fg-dim);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 3px 11px; font-size: 11.5px; font-family: var(--font-mono);
}
.mini:hover { color: var(--fg); border-color: var(--fg-faint); }
.mini-row { display: flex; gap: 6px; flex: none; }
.found { display: flex; flex-wrap: wrap; gap: 5px; }
.found span {
  font-family: var(--font-display); font-size: 13px;
  background: #15241F; border: 1px solid #2A5048; color: var(--jade);
  border-radius: 20px; padding: 1px 10px;
}
.missed { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.missed span {
  font-family: var(--font-display); font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-dim);
  border-radius: 20px; padding: 1px 10px;
}
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 40; max-width: 92vw;
  background: #2E2412; color: var(--gold); border: 1px solid #4A3E18;
  border-radius: 10px; padding: 10px 16px; font-size: 13px; text-align: center;
  box-shadow: 0 10px 30px -12px #000;
}
.btn .sub { display: block; font-size: 10px; font-weight: 500; opacity: .75; font-family: var(--font-mono); }

/* ---- panels ---- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; padding: 13px;
  display: flex; flex-direction: column; gap: 10px;
}
.panel h3 { font-size: 14px; display: flex; align-items: center; gap: 7px; }
.panel h3 .tag {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .1em; color: var(--fg-faint);
  border: 1px solid var(--line); border-radius: 20px; padding: 1px 7px;
}
.ups { display: flex; flex-direction: column; gap: 7px; }
.up {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px;
}
.up .t { font-size: 13.5px; font-weight: 600; }
.up .d { font-size: 11px; color: var(--fg-dim); font-family: var(--font-mono); }
.up button {
  background: #2E2412; color: var(--gold); border: 1px solid #4A3E18;
  border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 600;
  font-family: var(--font-mono); white-space: nowrap;
}
.up button:disabled { opacity: .4; }

.recs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.rec {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px; text-align: center;
}
.rec .k { font-size: 10.5px; color: var(--fg-dim); letter-spacing: .04em; }
.rec .v { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--gold); }
.rec.j .v { color: var(--jade); }

.note { font-size: 11.5px; color: var(--fg-faint); line-height: 1.55; }

/* ---- overlay ---- */
.ov {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(8,9,13,.9);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-left, 0px));
}
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px; max-width: 360px; width: 100%;
  display: flex; flex-direction: column; gap: 13px; text-align: center;
}
.card h2 { font-size: 24px; }
.card h2.win { color: var(--jade); }
.card h2.lose { color: var(--danger); }
.card .lead { font-size: 13.5px; color: var(--fg-dim); }
.card .big { font-family: var(--font-mono); font-size: 34px; font-weight: 600; color: var(--gold); line-height: 1.1; }
.card .row { display: flex; gap: 8px; }
.card .row .btn { flex: 1; }
.words { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.words span {
  font-family: var(--font-display); font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 20px; padding: 2px 10px;
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">

  <div class="hud">
    <div class="brand">
      <span class="nm">낱말 용사</span>
      <span class="lv" id="lv">Lv 1</span>
    </div>
    <div class="purse">
      <span class="coin g"><i>냥</i><span id="gold">0</span></span>

    </div>

  <div class="arena">
    <div class="stageline">
      <span><b id="stageNo">1</b>단계 / 100 · <span id="mtName">북한산</span> <span id="cycle"></span></span>

    <div class="bossrow">
      <div class="portrait" id="portrait">

  <div class="boardinfo">
    <span id="poolCount">글자판 대기</span>

      <button class="mini" id="btnShuffle">섞기</button>
      <button class="mini" id="btnNew">새 글자 −5초</button>
    </span>
  </div>
  <div class="found" id="found"></div>

  <div class="panel">

    <h3>기록 <span class="tag">일간 · 주간</span></h3>
    <div class="recs">
      <div class="rec"><div class="k">오늘 최고</div><div class="v mono" id="rToday">0</div></div>
      <div class="rec"><div class="k">이번 주</div><div class="v mono" id="rWeek">0</div></div>
      <div class="rec j"><div class="k">최고 단계</div><div class="v mono" id="rStage">1</div></div>
    </div>
    <p class="note" id="askedLine"></p>
    <p class="note">기록은 이 브라우저에만 저장됩니다. 실제 출시판에서는 이 자리가 <b>전국 일간·주간 랭킹</b>이 되고, 보상 수령이 재방문의 이유가 됩니다.</p>
  </div>

  <p class="note">※ 프로토타입입니다. 옥(보석)·광고는 <b>구조 확인용 시뮬레이션</b>이며 실제 결제나 광고가 없습니다.</p>

</div>

<script src="words.js"></script>
<script src="sinsu.js"></script>
<script>
(function () {
  "use strict";

  // 사전은 words.js에 따로 둔다. 상용판에서는 이 파일만 공개 사전으로
  // 갈아끼우면 되고, 게임 로직은 손대지 않는다.
  var DICT = (window.WORDS || []).filter(function (w, i, a) {
    return w.length >= 2 && w.length <= 4 && a.indexOf(w) === i;
  });

  var DSET = Object.create(null);
  DICT.forEach(function (w) { DSET[w] = true; });

  // 채움용 음절은 사전에서 뽑는다 — 무작위 글자보다 우연한 낱말이 훨씬 잘 생긴다
  var SYLS = [];
  DICT.forEach(function (w) { for (var i = 0; i < w.length; i++) SYLS.push(w[i]); });

  // 100단계 = 10개 산 x 10단계. 고유 아트는 신수 10종이면 충분하고,
  // 1~9단계는 칭호(어린/성난)로 변주한다. 10단계마다 수호신 전투.
  // 혼령이 아니라 상상의 동물이다. 무속·귀신과 선을 긋되 웅장함은 가져온다.
  // 동그라미에는 이름 첫 글자만 — 한자는 한글 낱말 게임에 어울리지 않는다.
  var MOUNTAINS = [
    { m: "북한산", n: "불가사리" },
    { m: "속리산", n: "삼족오" },
    { m: "계룡산", n: "해태" },
    { m: "설악산", n: "현무" },
    { m: "소백산", n: "백호" },
    { m: "덕유산", n: "기린" },
    { m: "지리산", n: "주작" },
    { m: "한라산", n: "백록" },
    { m: "금강산", n: "봉황" },
    { m: "백두산", n: "천지의 용" }
  ];
  var TITLES = ["어린 ", "어린 ", "어린 ", "", "", "", "성난 ", "성난 ", "성난 "];
  // 10종 모두 그림이 들어왔다. 코드 렌더러(sinsu.js)는 이제 대비용으로만 남는다.
  var ART = {
    "불가사리": "bulgasari", "삼족오": "samjogo", "해태": "haetae", "현무": "hyeonmu",
    "백호": "baekho", "기린": "kirin", "주작": "jujak", "백록": "baekrok",
    "봉황": "bonghwang", "천지의 용": "yong"
  };
  var HINTS = [
    "두 글자면 충분합니다", "세 글자는 세 배로 아픕니다", "연속으로 맞히면 배수가 붙습니다",
    "긴 낱말을 아껴두세요", "막히면 섞기를 누르세요", "10단계마다 수호신이 기다립니다"
  ];

  // 100단계를 버티려면 강화 효과가 곱셈이어야 한다. 덧셈이면 중반에
  // 반드시 벽이 생기고, 그 벽을 돈으로만 넘게 만들면 리뷰가 무너진다.
  var UPGRADES = [
    { id: "atk",   t: "붓끝 (공격력)",   base: 40,  r: 1.32,
      desc: function (s) { return "공격 x" + Math.pow(1.12, s.atk).toFixed(2); } },
    { id: "time",  t: "먹물 (제한시간)",  base: 90,  r: 1.38,
      desc: function (s) { return "+" + (s.time * 2) + "초"; } },
    { id: "combo", t: "인장 (연속 배수)", base: 150, r: 1.38,
      desc: function (s) { return "연속 보너스 +" + (s.combo * 10) + "%"; } }
  ];

  var KEY = "nathero-v1";
  var S = {
    gold: 0, gem: 30, stage: 0, cycle: 1,
    atk: 0, time: 0, combo: 0,
    best: {}, bestStage: 1
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var v = JSON.parse(raw);
        if (v && typeof v === "object") Object.assign(S, v);
      }
    } catch (e) { /* 저장소가 막혀도 게임은 돈다 */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  load();

  var el = {};
  ["lv","gold","gem","mtName","stageNo","cycle","timer","sigil","portrait","pimg","bossName","bossHint","hp","hpNow","hpMax",
   "slot","tiles","btnClear","btnHint","btnGo","goSub","goLabel","ups","rToday","rWeek","rStage",
   "floaters","poolCount","btnShuffle","btnNew","found","askedLine"
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  // ── 판 ──────────────────────────────────────────────────────────────
  var TILE_N = 12;
  var board = [];      // {ch}
  var picked = [];     // board 인덱스
  var answers = [];    // 이 글자판으로 만들 수 있는 사전 낱말 전부
  var found = [];      // 그중 플레이어가 찾은 것
  var run = null;      // 진행 중인 전투

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function formable(w, chars) {
    var pool = chars.slice();
    for (var i = 0; i < w.length; i++) {
      var k = pool.indexOf(w[i]);
      if (k < 0) return false;
      pool.splice(k, 1);
    }
    return true;
  }

  function canFormAny(chars) {
    for (var i = 0; i < DICT.length; i++) if (formable(DICT[i], chars)) return DICT[i];
    return null;
  }

  // 글자판이 바뀔 때마다 정답 집합을 미리 구해 둔다. 플레이어에게
  // "몇 글자짜리가 몇 개 남았는지"를 보여주기 위한 것 — 이게 있어야
  // 틀렸을 때 '게임이 이상하다'가 아니라 '내가 못 찾았다'가 된다.
  function computeAnswers() {
    var chars = board.map(function (t) { return t.ch; });
    answers = DICT.filter(function (w) { return formable(w, chars); });
    found = [];
  }

  // 판에는 반드시 풀 수 있는 낱말이 하나 이상 남아 있게 한다
  function ensureSolvable() {
    var chars = board.map(function (t) { return t.ch; });
    if (canFormAny(chars)) return;
    var seed = pick(DICT.filter(function (w) { return w.length <= 3; }));
    var spots = [];
    while (spots.length < seed.length) {
      var i = Math.floor(Math.random() * TILE_N);
      if (spots.indexOf(i) < 0) spots.push(i);
    }
    spots.forEach(function (i, k) { board[i] = { ch: seed[k] }; });
  }

  // 정답이 너무 적은 판은 답답하다. 몇 번 굴려서 가장 풍성한 판을 고른다.
  function fillBoard() {
    var best = null, bestN = -1;
    for (var t = 0; t < 12; t++) {
      var b = [];
      [pick(DICT), pick(DICT)].forEach(function (w) {
        for (var i = 0; i < w.length && b.length < TILE_N; i++) b.push({ ch: w[i] });
      });
      while (b.length < TILE_N) b.push({ ch: pick(SYLS) });
      var chars = b.map(function (x) { return x.ch; });
      var n = 0;
      for (i = 0; i < DICT.length; i++) if (formable(DICT[i], chars)) n++;
      if (n > bestN) { bestN = n; best = b; }
      if (n >= 5) break;
    }
    board = best;
    board.sort(function () { return Math.random() - 0.5; });
    ensureSolvable();
    computeAnswers();
    picked = [];
  }

  function remaining() {
    return answers.filter(function (w) { return found.indexOf(w) < 0; });
  }

  // ── 그리기 ──────────────────────────────────────────────────────────
  function drawTiles() {
    el.tiles.textContent = "";
    board.forEach(function (t, i) {
      var b = document.createElement("button");
      b.className = "tile" + (picked.indexOf(i) >= 0 ? " used" : "");
      b.textContent = t.ch;
      b.disabled = !run || picked.indexOf(i) >= 0;
      b.addEventListener("click", function () { tap(i); });
      el.tiles.appendChild(b);
    });
  }

  function currentWord() {
    return picked.map(function (i) { return board[i].ch; }).join("");
  }

  function drawSlot() {
    var w = currentWord();
    el.slot.textContent = "";
    if (!picked.length) {
      var ph = document.createElement("span");
      ph.className = "ph";
      ph.textContent = run ? "글자를 눌러 낱말을 만드세요" : "산을 오르세요";
      el.slot.appendChild(ph);
    } else {
      picked.forEach(function (i, k) {
        var s = document.createElement("button");
        s.className = "syl";
        s.textContent = board[i].ch;
        s.addEventListener("click", function () { picked.splice(k, 1); drawAll(); });
        el.slot.appendChild(s);
      });
    }
    var dup = DSET[w] && found.indexOf(w) >= 0;
    var valid = w.length >= 2 && DSET[w] && !dup;
    // 사전에 없다고 막아 세우기만 하면 그 자리에서 별 하나가 떨어진다.
    // 같은 버튼을 제보 창구로 바꿔, 불만이 그대로 어휘 데이터가 되게 한다.
    var askable = w.length >= 2 && !DSET[w];
    el.slot.classList.toggle("ok", valid);
    el.btnGo.classList.toggle("ask", askable);
    el.btnGo.disabled = !valid && !askable;
    el.goLabel.textContent = askable ? "등록 요청" : "공격";
    el.goSub.textContent = valid ? "+" + damageOf(w)
      : dup ? "이미 찾은 낱말"
      : (askable ? "사전에 없음 · 눌러서 제보" : "낱말 없음");
  }

  var toastT = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { t.remove(); }, 2600);
  }

  function requestWord(w) {
    if (!S.asked) S.asked = [];
    if (S.asked.indexOf(w) < 0) S.asked.push(w);
    save();
    toast("“" + w + "” 등록 요청 접수 — 검수 후 반영됩니다");
    picked = [];
    drawAll();
  }

  function drawStats() {
    el.lv.textContent = "Lv " + (1 + S.atk + S.time + S.combo);
    el.gold.textContent = S.gold;
    el.gem.textContent = S.gem;
    el.rToday.textContent = S.best[todayKey()] || 0;
    el.rWeek.textContent = weekTotal();
    el.rStage.textContent = S.bestStage;
    el.ups.textContent = "";
    UPGRADES.forEach(function (u) {
      var lvl = S[u.id], cost = Math.round(u.base * Math.pow(u.r, lvl));
      var row = document.createElement("div");
      row.className = "up";
      var left = document.createElement("div");
      var t = document.createElement("div"); t.className = "t"; t.textContent = u.t + " · " + lvl + "단계";
      var d = document.createElement("div"); d.className = "d"; d.textContent = u.desc(S);
      left.appendChild(t); left.appendChild(d);
      var b = document.createElement("button");
      b.textContent = "냥 " + cost;
      b.disabled = S.gold < cost;
      b.addEventListener("click", function () {
        if (S.gold < cost) return;
        S.gold -= cost; S[u.id]++; save(); drawStats();
      });
      row.appendChild(left); row.appendChild(b);
      el.ups.appendChild(row);
    });
  }

  function drawAll() {
    drawTiles(); drawSlot(); drawStats();
    if (!run) el.poolCount.innerHTML = "글자판 대기";
    else {
      var rest = remaining();
      if (!rest.length) el.poolCount.innerHTML = "<b>모두 찾았습니다</b>";
      else {
        var by = {};
        rest.forEach(function (w) { by[w.length] = (by[w.length] || 0) + 1; });
        el.poolCount.innerHTML = "남은 낱말 " + Object.keys(by).sort().map(function (k) {
          return k + "글자 <b>" + by[k] + "</b>";
        }).join(" · ");
      }
    }
    el.found.textContent = "";
    found.forEach(function (w) {
      var s = document.createElement("span"); s.textContent = w; el.found.appendChild(s);
    });
    var n = (S.asked || []).length;
    el.askedLine.textContent = n
      ? "내가 등록 요청한 낱말 " + n + "개 — " + S.asked.slice(-6).join(", ")
      : "";
  }

  // ── 전투 ────────────────────────────────────────────────────────────
  function damageOf(w) {
    var atkMul = Math.pow(1.12, S.atk);
    var comboMul = 1 + (run ? run.combo : 0) * (0.12 + S.combo * 0.10);
    var len = Math.pow(w.length, 1.75);
    return Math.round(12 * len * atkMul * comboMul);
  }

  function stageInfo(stage) {
    var loop = Math.floor(stage / 100), k = stage % 100;
    var M = MOUNTAINS[Math.floor(k / 10)], sub = k % 10;
    var boss = sub === 9;
    return {
      n: boss ? M.n + " 수호신" : TITLES[sub] + M.n,
      base: M.n,
      grade: boss ? "guard" : sub < 3 ? "young" : sub < 6 ? "base" : "angry",
      m: M.m, boss: boss, no: k + 1, loop: loop,
      hp: Math.round(150 * Math.pow(1.07, k) * (boss ? 2.4 : 1) * Math.pow(4, loop)),
      t: (boss ? 55 : 45) + S.time * 2,
      hint: k < HINTS.length ? HINTS[k] : ""
    };
  }

  function startStage() {
    var b = stageInfo(S.stage);
    run = { boss: b, hp: b.hp, max: b.hp, left: b.t, combo: 0, score: 0, words: [] };
    picked = [];
    fillBoard();
    // 그려진 신수가 있으면 그림을, 아직 없으면 코드 렌더러를 쓴다
    var art = ART[b.base];
    el.portrait.className = "portrait g-" + b.grade;
    el.pimg.hidden = !art;
    el.sigil.hidden = !!art;
    if (art) el.pimg.src = "art/" + art + ".jpg";
    else if (window.Sinsu) window.Sinsu.draw(el.sigil, b.base, b.grade);
    el.bossName.textContent = b.n;
    el.bossHint.textContent = b.hint;
    el.mtName.textContent = b.m;
    el.stageNo.textContent = b.no;
    el.cycle.textContent = b.loop ? "· " + (b.loop + 1) + "회차" : "";
    el.hpMax.textContent = b.hp;
    tick();
    drawAll();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(onSecond, 1000);
  }

  var timerId = null;
  function onSecond() {
    if (!run) return;
    run.left--;
    if (run.left <= 0) { run.left = 0; tick(); finish(false); return; }
    tick();
  }

  function tick() {
    if (!run) return;
    el.timer.textContent = run.left;
    el.timer.classList.toggle("low", run.left <= 10);
    el.hp.style.width = Math.max(0, (run.hp / run.max) * 100) + "%";
    el.hpNow.textContent = Math.max(0, run.hp);
  }

  function tap(i) {
    if (!run || picked.indexOf(i) >= 0) return;
    if (picked.length >= 4) return;
    picked.push(i);
    drawAll();
  }

  function floatDmg(n) {
    var d = document.createElement("div");
    d.className = "dmg";
    d.textContent = "-" + n;
    d.style.left = (18 + Math.random() * 40) + "%";
    d.style.top = "46%";
    el.floaters.appendChild(d);
    setTimeout(function () { d.remove(); }, 1000);
  }

  function attack() {
    var w = currentWord();
    if (!run || !DSET[w] || found.indexOf(w) >= 0) return;
    found.push(w);
    var dmg = damageOf(w);
    run.hp -= dmg;
    run.combo++;
    run.score += dmg;
    run.words.push(w);
    floatDmg(dmg);
    el.portrait.classList.add("hit");
    setTimeout(function () { el.portrait.classList.remove("hit"); }, 110);
    picked = [];
    // 글자판을 다 털면 보너스를 주고 새 글자를 깐다
    if (!remaining().length) {
      var bonus = Math.round(dmg * 0.8);
      run.hp -= bonus; run.score += bonus;
      floatDmg(bonus);
      toast("글자판을 모두 찾았습니다 · 보너스 +" + bonus);
      fillBoard();
    }
    tick();
    drawAll();
    if (run.hp <= 0) finish(true);
  }

  function finish(won) {
    if (timerId) { clearInterval(timerId); timerId = null; }
    var r = run; run = null;
    var reward = 0;
    if (won) {
      reward = Math.round(25 + r.max * 0.24);
      S.gold += reward;
      S.stage++;
      S.bestStage = Math.max(S.bestStage, S.stage + 1);
    }
    var k = todayKey();
    S.best[k] = Math.max(S.best[k] || 0, r.score);
    save();
    drawAll();
    overlay(won, r, reward);
  }

  // ── 기록 ────────────────────────────────────────────────────────────
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function weekTotal() {
    var sum = 0, now = new Date();
    for (var i = 0; i < 7; i++) {
      var d = new Date(now.getTime() - i * 86400000);
      var k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      sum += S.best[k] || 0;
    }
    return sum;
  }

  // ── 결과 / 과금 접점 ────────────────────────────────────────────────
  function overlay(won, r, reward) {
    var ov = document.createElement("div");
    ov.className = "ov";
    var card = document.createElement("div");
    card.className = "card";

    var h = document.createElement("h2");
    h.className = won ? "win" : "lose";
    h.textContent = won ? r.boss.n + ", 물러나다" : "해가 저물었습니다";
    card.appendChild(h);

    var big = document.createElement("div");
    big.className = "big";
    big.textContent = r.score.toLocaleString();
    card.appendChild(big);

    var lead = document.createElement("p");
    lead.className = "lead";
    lead.textContent = won
      ? "낱말 " + r.words.length + "개 · 획득 냥 " + reward
      : r.boss.n + "의 기세가 " + Math.max(0, r.hp) + " 남았습니다";
    card.appendChild(lead);

    if (r.words.length) {
      var ws = document.createElement("div");
      ws.className = "words";
      r.words.slice(-10).forEach(function (w) {
        var s = document.createElement("span"); s.textContent = w; ws.appendChild(s);
      });
      card.appendChild(ws);
    }

    // 못 찾은 낱말을 공개한다. 정답을 숨기면 "이게 왜 안 돼"가 남지만,
    // 보여주면 "아 그게 있었구나"가 되고 어휘를 하나 배워 간다.
    var miss = remaining().slice(0, 10);
    if (miss.length) {
      var mt = document.createElement("p");
      mt.className = "lead";
      mt.textContent = "이 글자판에 있었던 낱말";
      card.appendChild(mt);
      var ms = document.createElement("div");
      ms.className = "missed";
      miss.forEach(function (w) {
        var s = document.createElement("span"); s.textContent = w; ms.appendChild(s);
      });
      card.appendChild(ms);
    }

    var row = document.createElement("div");
    row.className = "row";

    if (!won) {
      // 과금 접점 1 — 부활. 리뷰에서 가장 많이 욕먹는 자리라 가장 정직해야 한다.
      var rev = document.createElement("button");
      rev.className = "btn";
      rev.innerHTML = "이어하기<span class='sub'>옥 20</span>";
      rev.disabled = S.gem < 20;
      rev.addEventListener("click", function () {
        S.gem -= 20; save(); ov.remove();
        run = { boss: r.boss, hp: r.hp, max: r.max, left: 20, combo: 0, score: r.score, words: r.words };
        picked = []; fillBoard(); tick(); drawAll();
        timerId = setInterval(onSecond, 1000);
      });
      row.appendChild(rev);

      var ad = document.createElement("button");
      ad.className = "btn";
      ad.innerHTML = "광고 보고 이어하기<span class='sub'>30초 · 시뮬</span>";
      ad.addEventListener("click", function () {
        ov.remove();
        run = { boss: r.boss, hp: r.hp, max: r.max, left: 20, combo: 0, score: r.score, words: r.words };
        picked = []; fillBoard(); tick(); drawAll();
        timerId = setInterval(onSecond, 1000);
      });
      row.appendChild(ad);
    } else {
      var next = document.createElement("button");
      next.className = "btn go";
      next.textContent = "다음 산으로";
      next.addEventListener("click", function () { ov.remove(); startStage(); });
      row.appendChild(next);
    }
    card.appendChild(row);

    var again = document.createElement("button");
    again.className = "btn";
    again.textContent = won ? "수련하러 가기" : "다시 도전";
    again.addEventListener("click", function () {
      ov.remove();
      if (!won) startStage();
      else { drawAll(); window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }
    });
    card.appendChild(again);

    ov.appendChild(card);
    document.body.appendChild(ov);
  }

  // 과금 접점 2 — 힌트
  el.btnHint.addEventListener("click", function () {
    if (!run || S.gem < 5) return;
    // 남은 것 중 가장 긴 낱말을 알려준다. 플레이어가 가장 찾기 어려워하는
    // 것이고 데미지도 가장 크다. 옥 5개가 아깝지 않아야 또 쓴다.
    var rest = remaining().sort(function (a, b) { return b.length - a.length; });
    if (!rest.length) return;
    var w = rest[0];
    S.gem -= 5; save();
    picked = [];
    for (var i = 0; i < w.length; i++) {
      for (var j = 0; j < board.length; j++) {
        if (board[j].ch === w[i] && picked.indexOf(j) < 0) { picked.push(j); break; }
      }
    }
    drawAll();
  });

  el.btnClear.addEventListener("click", function () { picked = []; drawAll(); });
  el.btnGo.addEventListener("click", function () {
    var w = currentWord();
    if (DSET[w]) attack();
    else if (w.length >= 2) requestWord(w);
  });
  // 섞기는 순서만 바꾼다 — 정답 집합은 그대로다
  el.btnShuffle.addEventListener("click", function () {
    if (!run) return;
    picked = [];
    board.sort(function () { return Math.random() - 0.5; });
    drawAll();
  });
  // 정말 막혔을 때만. 공짜면 계속 눌러 넘기게 되니 시간을 받는다
  el.btnNew.addEventListener("click", function () {
    if (!run) return;
    run.left = Math.max(1, run.left - 5);
    fillBoard();
    tick(); drawAll();
  });

  // 키보드로도 — PC에서 심사·시연할 때 필요하다
  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !el.btnGo.disabled) { attack(); e.preventDefault(); }
    if (e.key === "Backspace" && picked.length) { picked.pop(); drawAll(); e.preventDefault(); }
    if (e.key === "Escape") { picked = []; drawAll(); }
  });

  var hot = window.claude && window.claude.hot;
  function boot() { drawAll(); startStage(); }
  if (hot && hot.snapshot) hot.snapshot(function () { return { s: S }; });
  if (hot && hot.ready) hot.ready(boot); else boot();
})();
</script>
