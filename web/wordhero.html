<title>낱말 용사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column, boss on top, tiles at thumb height. Committed single dark
   theme - ink-wash night. Colors: 먹(ground), 한지(text), 인장 주홍(accent),
   금니(currency), 청자(positive). */
:root {
  --bg: #11131A;
  --surface: #1A1D27;
  --surface-2: #242838;
  --line: #333950;
  --fg: #ECEAE3;
  --fg-dim: #969BB3;
  --fg-faint: #656B85;
  --accent: #D6453A;
  --accent-soft: #3A1715;
  --gold: #C9A227;
  --jade: #4A9E8F;
  --danger: #E0683C;
  --font-display: "Gowun Batang", serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  margin: 0;
}
.wrap {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 92px;   /* 아래 고정 버튼에 가리지 않도록 */
}

/* 수련하러 내려갔다가 다시 싸우러 갈 길이 필요하다. 전투가 끝난 동안
   화면 아래에 늘 떠 있게 한다. */
.resume {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 18px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(17,19,26,0) 0%, var(--bg) 45%);
  display: flex; justify-content: center;
}
.resume .btn { width: 100%; max-width: 460px; padding: 15px; font-size: 15.5px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font-display); font-weight: 700; }
p { margin: 0; }
button { font-family: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- top status ---- */
.hud {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
}
.brand { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.brand .nm { font-family: var(--font-display); font-size: 19px; letter-spacing: .02em; }
.brand .lv {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  color: var(--gold); border: 1px solid #4A3E18; background: #241F0D;
  border-radius: 20px; padding: 1px 7px; white-space: nowrap;
}
.purse { display: flex; gap: 6px; }
.coin {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 3px 10px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
}
.coin i { font-style: normal; font-size: 11px; }
.coin.g { color: var(--gold); }
.coin.j { color: #7FD4E8; }
.coin.snd {
  font-family: var(--font-body); font-size: 13px; cursor: pointer;
  color: var(--gold); border-color: #4A3E18; background: #241F0D; padding: 3px 11px;
}
.coin.snd[aria-pressed="false"] { color: var(--fg-faint); background: var(--surface); border-color: var(--line); }
.coin.snd:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---- boss ---- */
.arena {
  background: linear-gradient(180deg, #171A24 0%, #12141C 100%);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}
.arena::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 0%, rgba(214,69,58,.10), transparent 65%);
}
.stageline {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 11.5px; color: var(--fg-dim);
  font-family: var(--font-mono); letter-spacing: .06em;
}
.stageline .timer { font-size: 15px; font-weight: 600; color: var(--fg); }
.stageline .timer.low { color: var(--danger); }
.bossrow { display: flex; align-items: center; gap: 13px; }
/* 신수는 한지에 그린 그림이다. 어두운 먹색 UI 위에 족자처럼 걸린다.
   등급은 그림을 다시 그리는 게 아니라 필터와 테두리로만 구분한다. */
.portrait {
  width: 104px; height: 142px; flex: none; position: relative;
  border-radius: 8px; overflow: hidden; background: #E8E2D2;
  box-shadow: 0 0 0 1px #0007, 0 8px 22px -10px #000;
  transition: transform .09s ease, box-shadow .25s ease, filter .25s ease;
}
.pinner { width: 100%; height: 100%; }
.portrait img, .portrait canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait canvas { background: #171A24; }
.portrait.hit { transform: translateX(-7px) scale(.95); }
.portrait.g-young { filter: grayscale(.3) opacity(.86); }
.portrait.g-angry { filter: contrast(1.2) saturate(1.5) brightness(.96); }
.portrait.g-guard { box-shadow: 0 0 0 2px var(--gold), 0 8px 28px -8px rgba(201,162,39,.75); }

/* ---- 수호신전 ----
   10단계는 같은 그림을 쓰면서도 체격이 달라야 한다. 족자가 커지고,
   기세가 꺾이면 커지는 폭을 한 번 더 키우며 떨게 만든다. 크기는
   width/height로만 키운다 — transform을 쓰면 .hit과 또 부딪힌다. */
.portrait.boss { width: 126px; height: 172px; }
.portrait.boss.p2 {
  width: 138px; height: 188px;
  filter: contrast(1.32) saturate(1.75) brightness(1.02);
  box-shadow: 0 0 0 2px #D6453A, 0 0 36px -4px rgba(214,69,58,.85);
}
.portrait.boss.p3 {
  width: 150px; height: 204px;
  filter: contrast(1.45) saturate(2) brightness(1.06);
  box-shadow: 0 0 0 2px #FF6A5A, 0 0 48px -2px rgba(214,69,58,.95);
}
.portrait.boss.p2 .pinner { animation: quake .72s steps(4, end) infinite; }
.portrait.boss.p3 .pinner { animation: quake .34s steps(4, end) infinite; }
@keyframes quake {
  0%   { transform: translate(0, 0) }
  25%  { transform: translate(-2px, 1.5px) }
  50%  { transform: translate(2px, -1.5px) }
  75%  { transform: translate(-1.5px, -2px) }
  100% { transform: translate(0, 0) }
}
.rage {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  letter-spacing: .2em; padding: 3px 9px; border-radius: 20px;
  background: #D6453A; color: #fff; white-space: nowrap;
  box-shadow: 0 2px 10px -2px #000;
  animation: ragepulse 1.1s ease-in-out infinite;
}
.rage.fin { background: var(--gold); color: #1A1206; animation-duration: .5s; }
@keyframes ragepulse { 50% { opacity: .55; } }

/* 폭주 중에는 판 전체에 붉은 기운이 돈다 */
body.raging .arena::after {
  background: radial-gradient(130% 80% at 50% 0%, rgba(214,69,58,.3), transparent 70%);
  animation: ragepulse 1.6s ease-in-out infinite;
}
.hpbar i.regen { background: linear-gradient(90deg, #D6453A, #FF8A7A) !important; }

/* 약점 글자 — 수호신의 비늘이 벌어진 자리 */
.tile.weak {
  color: #1A1206; border-color: #F0D98A;
  background: linear-gradient(180deg, #EBCB72, #C9A227);
  box-shadow: 0 0 16px -2px rgba(201,162,39,.95);
  animation: weakpulse 1.2s ease-in-out infinite;
}
@keyframes weakpulse { 50% { box-shadow: 0 0 6px -2px rgba(201,162,39,.5); } }
@media (prefers-reduced-motion: reduce) {
  .portrait.boss .pinner, .rage, .tile.weak, body.raging .arena::after { animation: none; }
}
.stageline b { color: var(--fg); font-size: 13px; font-weight: 600; }

.modes { display: flex; gap: 6px; }
.modes .mode {
  flex: 1; font-family: var(--font-body); font-size: 13.5px; font-weight: 600;
  background: var(--surface); color: var(--fg-dim);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px; cursor: pointer;
}
.modes .mode.on { background: #2E2412; color: var(--gold); border-color: #4A3E18; }
.modes .mode:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.dailybar { display: flex; flex-direction: column; gap: 9px; }
.dailybar .dtop {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); letter-spacing: .05em;
}
.dprog { height: 13px; background: #0C0E14; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.dprog i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #2F7A6B, var(--jade)); transition: width .3s cubic-bezier(.2,.8,.3,1); }
.dnums { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); }
.dnums b { font-family: var(--font-mono); color: var(--fg); font-size: 16px; }

.share {
  background: var(--code); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px; font-family: var(--font-mono); font-size: 13px; line-height: 1.75;
  white-space: pre-wrap; text-align: left; color: #D5D8E6;
}
.bossinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bossname { font-family: var(--font-display); font-size: 17px; }
.bossname small { font-family: var(--font-body); font-size: 11.5px; color: var(--fg-faint); margin-left: 6px; }
.hpbar { height: 13px; background: #0C0E14; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #B8332A, var(--accent)); width: 100%; transition: width .3s cubic-bezier(.2,.8,.3,1); }
.hpnum { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }
.floaters { position: absolute; inset: 0; pointer-events: none; }
.dmg {
  position: absolute; font-family: var(--font-mono); font-weight: 600;
  color: var(--gold); font-size: 20px; text-shadow: 0 2px 6px #000;
  animation: rise 1s ease-out forwards;
}
@keyframes rise { to { transform: translateY(-46px); opacity: 0 } }
/* 약점을 짚었을 때는 숫자가 더 크고 밝게, 흘려보냈을 때는 작고 흐리게.
   숫자를 읽지 않아도 '통했는지'를 눈으로 알 수 있어야 한다. */
.dmg.weak { font-size: 25px; color: #FFE08A; text-shadow: 0 0 14px rgba(201,162,39,.9), 0 2px 6px #000; }
.dmg.weak-no { font-size: 15px; color: #8B90A3; }

/* ---- word slot ---- */
.slot {
  min-height: 56px;
  background: var(--surface); border: 1px dashed var(--line);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; flex-wrap: wrap;
}
.slot.ok { border-style: solid; border-color: var(--jade); background: #15241F; }
.slot .ph { color: var(--fg-faint); font-size: 13px; }
.syl {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 21px; font-weight: 700;
  background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 9px;
}
.slot .syl { background: #2C3142; }

/* ---- tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.tile {
  aspect-ratio: 1; width: 100%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(18px, 5.4vw, 23px); font-weight: 700;
  background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  transition: transform .08s ease, opacity .15s ease;
}
.tile:active { transform: scale(.92); }
.tile[disabled] { opacity: .22; }
.tile.used { opacity: .25; }

/* ---- actions ---- */
.acts { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 7px; }
.btn {
  border-radius: 11px; padding: 12px 8px;
  font-size: 14px; font-weight: 600;
  background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.go { background: var(--accent); color: #fff; border-color: transparent; }
.btn.go:disabled { background: var(--surface-2); color: var(--fg-faint); border-color: var(--line); }
.btn.go.ask { background: var(--surface-2); color: var(--gold); border-color: #4A3E18; }

.boardinfo {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-dim);
  padding: 0 2px; margin-top: -2px;
}
.boardinfo b { color: var(--jade); font-weight: 600; }
.mini {
  background: transparent; color: var(--fg-dim);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 3px 11px; font-size: 11.5px; font-family: var(--font-mono);
}
.mini:hover { color: var(--fg); border-color: var(--fg-faint); }
.mini-row { display: flex; gap: 6px; flex: none; }
.found { display: flex; flex-wrap: wrap; gap: 5px; }
.found span {
  font-family: var(--font-display); font-size: 13px;
  background: #15241F; border: 1px solid #2A5048; color: var(--jade);
  border-radius: 20px; padding: 1px 10px;
}
.missed { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.missed span {
  font-family: var(--font-display); font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-dim);
  border-radius: 20px; padding: 1px 10px;
}
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 40; max-width: 92vw;
  background: #2E2412; color: var(--gold); border: 1px solid #4A3E18;
  border-radius: 10px; padding: 10px 16px; font-size: 13px; text-align: center;
  box-shadow: 0 10px 30px -12px #000;
}
.btn .sub { display: block; font-size: 10px; font-weight: 500; opacity: .75; font-family: var(--font-mono); }

/* ---- panels ---- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; padding: 13px;
  display: flex; flex-direction: column; gap: 10px;
}
.panel h3 { font-size: 14px; display: flex; align-items: center; gap: 7px; }
.panel h3 .tag {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .1em; color: var(--fg-faint);
  border: 1px solid var(--line); border-radius: 20px; padding: 1px 7px;
}
.ups { display: flex; flex-direction: column; gap: 7px; }
.up {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px;
}
.up .t { font-size: 13.5px; font-weight: 600; }
.up .d { font-size: 11px; color: var(--fg-dim); font-family: var(--font-mono); }
.up .rate.hi { color: var(--jade); }
.up .rate.mid { color: var(--gold); }
.up .rate.lo { color: var(--accent); }
.up button {
  background: #2E2412; color: var(--gold); border: 1px solid #4A3E18;
  border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 600;
  font-family: var(--font-mono); white-space: nowrap;
}
.up button:disabled { opacity: .4; }

.recs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.rec {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px; text-align: center;
}
.rec .k { font-size: 10.5px; color: var(--fg-dim); letter-spacing: .04em; }
.rec .v { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--gold); }
.rec.j .v { color: var(--jade); }

.note { font-size: 11.5px; color: var(--fg-faint); line-height: 1.55; }

/* ---- overlay ---- */
.ov {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(8,9,13,.9);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-left, 0px));
}
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px; max-width: 360px; width: 100%;
  display: flex; flex-direction: column; gap: 13px; text-align: center;
}
.card h2 { font-size: 24px; }
.card h2.win { color: var(--jade); }
.card h2.lose { color: var(--danger); }
.card .lead { font-size: 13.5px; color: var(--fg-dim); }
.card .big { font-family: var(--font-mono); font-size: 34px; font-weight: 600; color: var(--gold); line-height: 1.1; }
.card .row { display: flex; gap: 8px; }
.card .row .btn { flex: 1; }
/* 낙관 — 결과 카드의 얼굴. 붉은 인주에 흰 글씨 */
.seal {
  align-self: center; display: grid; place-items: center;
  width: 92px; height: 92px; border-radius: 14px;
  background: linear-gradient(160deg, #C4332A, #8E201A);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.22), 0 10px 26px -10px #000;
  transform: rotate(-4deg);
}
.seal.full { background: linear-gradient(160deg, #D8B13C, #9C7415); }
.seal span {
  font-family: var(--font-display); font-weight: 700; color: #fff;
  font-size: 19px; line-height: 1.18; letter-spacing: .02em;
  width: 2.4em; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.35);
}

/* 글자 수별 결과표 */
.sgrid { display: flex; flex-direction: column; gap: 7px; }
.sline { display: flex; align-items: center; gap: 9px; }
.sline i {
  font-style: normal; font-family: var(--font-mono); font-size: 11.5px;
  color: var(--fg-dim); width: 42px; text-align: right; flex: none;
}
.sline u { text-decoration: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-dim); flex: none; }
.sline .cells { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.sline .c { width: 15px; height: 15px; border-radius: 4px; display: block; }
.c0 { background: transparent; box-shadow: inset 0 0 0 1.5px #343A4C; }
.c2 { background: #35A06B; }
.c3 { background: #4A79D8; }
.c4 { background: #9B5BD6; }
.legend { font-size: 11.5px; opacity: .8; }
.shbox > summary {
  cursor: pointer; font-size: 12px; color: var(--fg-dim);
  padding: 7px; border: 1px dashed var(--line); border-radius: 9px; list-style: none;
}
.shbox > summary::-webkit-details-marker { display: none; }
.shbox[open] > summary { margin-bottom: 8px; }
.shbox .share { font-size: 11.5px; line-height: 1.7; max-height: 230px; overflow: auto; overflow-wrap: anywhere; }

.words { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.words span {
  font-family: var(--font-display); font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 20px; padding: 2px 10px;
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">

  <div class="hud">
    <div class="brand">
      <span class="nm">낱말 용사</span>
      <span class="lv" id="lv">수련 0단</span>
    </div>
    <div class="purse">
      <span class="coin g"><i>냥</i><span id="gold">0</span></span>
      <span class="coin j"><i>옥</i><span id="gem">30</span></span>
      <button class="coin snd" id="btnSound" aria-pressed="true" title="소리 켜기/끄기">♪</button>
    </div>
  </div>

  <div class="modes">
    <button class="mode on" data-m="quest">모험</button>
    <button class="mode" data-m="daily">오늘의 낱말</button>
  </div>

  <div class="arena">
   <div id="questHead">
    <div class="stageline">
      <span><b id="stageNo">1</b>단계 / 100 · <span id="mtName">북한산</span> <span id="cycle"></span></span>
      <span class="timer" id="timer">45</span>
    </div>
    <div class="bossrow">
      <div class="portrait" id="portrait">

<script src="words.js"></script>
<script src="sfx.js"></script>
<script src="sinsu.js"></script>
<script>
(function () {
  "use strict";

  // 사전은 words.js에 두 층으로 나뉘어 있다.
  //  DICT = 출제·표시용. 글자판을 만들고 "남은 낱말 N개"를 세는 기준.
  //         사람들이 아는 낱말만 들어 있어야 그 숫자가 거짓말이 안 된다.
  //  ACCEPT = 인정용. 표준국어대사전 명사 전체. 출제에는 안 쓰지만
  //         플레이어가 만들어 오면 받아준다.
  var DICT = (window.WORDS_SEED || []).filter(function (w) {
    return w.length >= 2 && w.length <= 4;
  });

  // 인정 목록은 19만 개짜리 한 덩어리 문자열이다. 배열로 쪼개 Set에 넣으면
  // 첫 화면이 1.6초 늦어지므로, 앞뒤 공백을 끼워 indexOf로 찾는다.
  var ACCEPT = window.WORDS_ACCEPT || " ";
  var SEEDSET = Object.create(null);
  DICT.forEach(function (w) { SEEDSET[w] = true; });
  // 70만 자 문자열 훑기가 1회 2ms쯤 걸린다. 글자를 누를 때마다 같은 낱말을
  // 몇 번씩 다시 묻게 되므로 결과를 기억해 둔다.
  var ACACHE = Object.create(null);
  function accepted(w) {
    if (w.length < 2) return false;
    var c = ACACHE[w];
    if (c !== undefined) return c;
    return (ACACHE[w] = SEEDSET[w] === true || ACCEPT.indexOf(" " + w + " ") >= 0);
  }

  // 채움용 음절은 사전에서 뽑는다 — 무작위 글자보다 우연한 낱말이 훨씬 잘 생긴다
  var SYLS = [];
  DICT.forEach(function (w) { for (var i = 0; i < w.length; i++) SYLS.push(w[i]); });

  // 100단계 = 10개 산 x 10단계. 고유 아트는 신수 10종이면 충분하고,
  // 1~9단계는 칭호(어린/성난)로 변주한다. 10단계마다 수호신 전투.
  // 혼령이 아니라 상상의 동물이다. 무속·귀신과 선을 긋되 웅장함은 가져온다.
  // 동그라미에는 이름 첫 글자만 — 한자는 한글 낱말 게임에 어울리지 않는다.
  var MOUNTAINS = [
    { m: "북한산", n: "불가사리" },
    { m: "속리산", n: "삼족오" },
    { m: "계룡산", n: "해태" },
    { m: "설악산", n: "현무" },
    { m: "소백산", n: "백호" },
    { m: "덕유산", n: "기린" },
    { m: "지리산", n: "주작" },
    { m: "한라산", n: "백록" },
    { m: "금강산", n: "봉황" },
    { m: "백두산", n: "천지의 용" }
  ];
  var TITLES = ["어린 ", "어린 ", "어린 ", "", "", "", "성난 ", "성난 ", "성난 "];
  // 10종 모두 그림이 들어왔다. 코드 렌더러(sinsu.js)는 이제 대비용으로만 남는다.
  var ART = {
    "불가사리": "bulgasari", "삼족오": "samjogo", "해태": "haetae", "현무": "hyeonmu",
    "백호": "baekho", "기린": "kirin", "주작": "jujak", "백록": "baekrok",
    "봉황": "bonghwang", "천지의 용": "yong"
  };
  var HINTS = [
    "두 글자면 충분합니다", "세 글자는 세 배로 아픕니다", "연속으로 맞히면 배수가 붙습니다",
    "긴 낱말을 아껴두세요", "막히면 섞기를 누르세요", "10단계마다 수호신이 기다립니다"
  ];

  // 100단계를 버티려면 강화 효과가 곱셈이어야 한다. 덧셈이면 중반에
  // 반드시 벽이 생기고, 그 벽을 돈으로만 넘게 만들면 리뷰가 무너진다.
  // 확률 강화가 들어가면 같은 단계에 도달하는 데 드는 돈이 실패만큼 늘어난다.
  // 그래서 비용 증가율을 1.32에서 1.16으로 크게 낮췄다. 초반은 싸게 올리고
  // 후반은 돈이 아니라 확률이 벽이 되게 하려는 것이다.
  //
  // 세 축의 상한값에서의 기여도를 비슷하게 맞춘다. 전에는 인장이
  // 단계당 +10%p여서 9단계면 5연속에 x6.1이 붙었다. 붓끝 상한이 x3.25인데
  // 인장 하나가 그 두 배였고, 그래서 수호신이 한 방에 녹았다.
  // 인장은 단계당 +3%p로 내리고(9단계 5연속 x2.95), 먹물은 체감이 덧셈이라
  // 뒤로 갈수록 묻히므로 2초에서 3초로 올렸다.
  var UPGRADES = [
    { id: "atk",   t: "붓끝 (공격력)",   base: 40,  r: 1.16,
      desc: function (s) { return "공격 x" + Math.pow(ATK_STEP, s.atk).toFixed(2); } },
    { id: "time",  t: "먹물 (제한시간)",  base: 90,  r: 1.22,
      desc: function (s) { return "+" + (s.time * TIME_STEP) + "초"; } },
    { id: "combo", t: "인장 (연속 배수)", base: 150, r: 1.22,
      desc: function (s) { return "연속마다 +" + Math.round((0.12 + s.combo * COMBO_STEP) * 100) + "%"; } }
  ];
  var ATK_STEP = 1.14, TIME_STEP = 3, COMBO_STEP = 0.03;
  // 연속은 12까지만 쌓인다. 상한이 없으면 배수가 끝없이 불어나,
  // 손이 빠른 사람에겐 수호신이 한순간에 녹고 느린 사람에겐 꿈쩍도
  // 않는 외길이 된다. 상한을 두면 난이도 곡선이 평평해진다.
  var COMBO_CAP = 12;

  // 상한을 둔다. 확률 강화에 상한이 없으면 성공률이 바닥에 수렴해
  // 돈만 먹는 구간이 끝없이 이어지고, "다 올렸다"는 완성감이 없다.
  // 한 회차에 9단계까지. 다음 회차로 넘어가면 9단계가 더 열린다.
  var CAP_PER_CYCLE = 9;
  function upCap() { return CAP_PER_CYCLE * (Math.floor(S.stage / 100) + 1); }

  // 전체 단수는 세 축의 '평균'이다.
  //  - 합(0~27)으로 하면 숫자가 커서 단수 이야기를 할 수 없다.
  //  - 최고단계로 하면 한 축만 밀어도 올라가서 균형을 전혀 요구하지 않는다.
  //  - 평균은 9단이 되려면 세 축을 모두 9로 올려야 한다는 뜻이고,
  //    한 축만 9여도 3단에 머무르므로 고르게 올리는 쪽을 보상한다.
  function trainLv() { return Math.floor((S.atk + S.time + S.combo) / 3); }

  // 4단계까지는 확정 성공. 거기서 배우고, 그 뒤부터 확률이 걸린다.
  // 실패해도 단계는 내려가지 않는다. 내려가는 순간 과금 압박이 되고
  // 리뷰가 무너진다. 대신 연속 실패를 보정으로 갚아, 운이 나빠서
  // 영영 못 올라가는 일이 없게 한다.
  function successRate(lvl, fails) {
    var k = lvl % CAP_PER_CYCLE;          // 회차가 바뀌면 다시 쉬운 구간부터
    if (k < 3) return 1;                   // 0~2단계는 확정. 여기서 규칙을 배운다
    // 마지막 한 칸(8->9)이 약 45%가 되도록. 연속 실패는 10%p씩 갚아준다.
    return Math.min(1, Math.max(0.20, 0.92 - (k - 2) * 0.095) + fails * 0.10);
  }

  var KEY = "nathero-v1";
  var S = {
    gold: 0, gem: 30, stage: 0, cycle: 1,
    atk: 0, time: 0, combo: 0,
    fails: { atk: 0, time: 0, combo: 0 },
    sound: true,
    best: {}, bestStage: 1
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var v = JSON.parse(raw);
        if (v && typeof v === "object") Object.assign(S, v);
      }
    } catch (e) { /* 저장소가 막혀도 게임은 돈다 */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  load();
  if (!S.fails) S.fails = { atk: 0, time: 0, combo: 0 };

  var el = {};
  ["lv","gold","gem","mtName","stageNo","cycle","timer","sigil","portrait","pimg","bossName","bossHint","hp","hpNow","hpMax",
   "slot","tiles","btnClear","btnHint","btnGo","goSub","goLabel","ups","rToday","rWeek","rStage",
   "floaters","poolCount","btnShuffle","btnNew","found","askedLine","resume","btnFight","fightLabel","rage","pinner",
   "questHead","dailyHead","dDate","dTimer","dBar","dFound","dTotal","dScore","trainPanel","btnSound"
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  // ── 판 ──────────────────────────────────────────────────────────────
  var TILE_N = 12;
  var board = [];      // {ch}
  var picked = [];     // board 인덱스
  var answers = [];    // 이 글자판으로 만들 수 있는 사전 낱말 전부
  var found = [];      // 그중 플레이어가 찾은 것
  var run = null;      // 진행 중인 전투

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function formable(w, chars) {
    var pool = chars.slice();
    for (var i = 0; i < w.length; i++) {
      var k = pool.indexOf(w[i]);
      if (k < 0) return false;
      pool.splice(k, 1);
    }
    return true;
  }

  function canFormAny(chars) {
    for (var i = 0; i < DICT.length; i++) if (formable(DICT[i], chars)) return DICT[i];
    return null;
  }

  // 글자판이 바뀔 때마다 정답 집합을 미리 구해 둔다. 플레이어에게
  // "몇 글자짜리가 몇 개 남았는지"를 보여주기 위한 것 — 이게 있어야
  // 틀렸을 때 '게임이 이상하다'가 아니라 '내가 못 찾았다'가 된다.
  function computeAnswers() {
    var chars = board.map(function (t) { return t.ch; });
    answers = DICT.filter(function (w) { return formable(w, chars); });
    found = [];
  }

  // 판에는 반드시 풀 수 있는 낱말이 하나 이상 남아 있게 한다
  function ensureSolvable(rnd) {
    rnd = rnd || Math.random;
    var chars = board.map(function (t) { return t.ch; });
    if (canFormAny(chars)) return;
    var pool = DICT.filter(function (w) { return w.length <= 3; });
    var seed = pool[Math.floor(rnd() * pool.length)];
    var spots = [];
    while (spots.length < seed.length) {
      var i = Math.floor(rnd() * TILE_N);
      if (spots.indexOf(i) < 0) spots.push(i);
    }
    spots.forEach(function (i, k) { board[i] = { ch: seed[k] }; });
  }

  // 정답이 너무 적은 판은 답답하다. 몇 번 굴려서 가장 풍성한 판을 고른다.
  // rnd를 받으면 같은 글자판이 재현된다. 오늘의 낱말은 날짜를 씨앗으로
  // 넘겨, 모두가 같은 문제를 받는다. 그래야 점수를 비교할 수 있다.
  function fillBoard(rnd) {
    rnd = rnd || Math.random;
    var pk = function (a) { return a[Math.floor(rnd() * a.length)]; };
    var best = null, bestN = -1;
    for (var t = 0; t < 12; t++) {
      var b = [];
      [pk(DICT), pk(DICT)].forEach(function (w) {
        for (var i = 0; i < w.length && b.length < TILE_N; i++) b.push({ ch: w[i] });
      });
      while (b.length < TILE_N) b.push({ ch: pk(SYLS) });
      var chars = b.map(function (x) { return x.ch; });
      var n = 0;
      for (var i = 0; i < DICT.length; i++) if (formable(DICT[i], chars)) n++;
      if (n > bestN) { bestN = n; best = b; }
      if (n >= 5) break;
    }
    board = best;
    board.sort(function () { return rnd() - 0.5; });
    ensureSolvable(rnd);
    computeAnswers();
    picked = [];
  }

  function remaining() {
    return answers.filter(function (w) { return found.indexOf(w) < 0; });
  }

  // ── 그리기 ──────────────────────────────────────────────────────────
  function drawTiles() {
    el.tiles.textContent = "";
    board.forEach(function (t, i) {
      var b = document.createElement("button");
      b.className = "tile" + (picked.indexOf(i) >= 0 ? " used" : "")
        + (run && run.weak && run.weak.indexOf(i) >= 0 ? " weak" : "");
      b.textContent = t.ch;
      b.disabled = !playing() || picked.indexOf(i) >= 0;
      b.addEventListener("click", function () { tap(i); });
      el.tiles.appendChild(b);
    });
  }

  function currentWord() {
    return picked.map(function (i) { return board[i].ch; }).join("");
  }

  function drawSlot() {
    var w = currentWord();
    el.slot.textContent = "";
    if (!picked.length) {
      var ph = document.createElement("span");
      ph.className = "ph";
      ph.textContent = playing() ? "글자를 눌러 낱말을 만드세요"
        : (mode === "daily" ? "오늘은 끝났습니다" : "산을 오르세요");
      el.slot.appendChild(ph);
    } else {
      picked.forEach(function (i, k) {
        var s = document.createElement("button");
        s.className = "syl";
        s.textContent = board[i].ch;
        s.addEventListener("click", function () { picked.splice(k, 1); drawAll(); });
        el.slot.appendChild(s);
      });
    }
    var ok = accepted(w);
    var dup = ok && found.indexOf(w) >= 0;
    var valid = ok && !dup;
    // 사전에 없다고 막아 세우기만 하면 그 자리에서 별 하나가 떨어진다.
    // 같은 버튼을 제보 창구로 바꿔, 불만이 그대로 어휘 데이터가 되게 한다.
    var askable = w.length >= 2 && !ok;
    el.slot.classList.toggle("ok", valid);
    el.btnGo.classList.toggle("ask", askable);
    el.btnGo.disabled = !valid && !askable;
    el.goLabel.textContent = askable ? "등록 요청" : "공격";
    el.goSub.textContent = valid ? "+" + damageOf(w)
      : dup ? "이미 찾은 낱말"
      : (askable ? "사전에 없음 · 눌러서 제보" : "낱말 없음");
  }

  // ── 오늘의 낱말 ─────────────────────────────────────────────
  // 모두가 같은 글자판을 받아야 점수 비교가 의미를 가진다. 그래서
  // 날짜를 씨앗으로 쓴다. 하루 한 번, 90초, 끝나면 공유용 요약이 나온다.
  var mode = "quest";
  var daily = null;
  var DAILY_SEC = 90;

  function srng(seed) {
    var x = seed >>> 0;
    return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  }
  function dailySeed() {
    var d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function dailyKey() { return "daily-" + todayKey(); }

  // 소리는 켜둔 채로 시작한다. 브라우저 정책상 첫 터치 전에는 어차피
  // 나지 않으므로, 갑자기 울려 놀랄 일이 없다.
  function applySound() {
    var v = S.sound !== false;
    if (window.SFX) SFX.set(v);
    el.btnSound.setAttribute("aria-pressed", v ? "true" : "false");
    el.btnSound.textContent = v ? "\u266a" : "\u00d7";
    el.btnSound.title = v ? "소리 끄기" : "소리 켜기";
  }
  el.btnSound.addEventListener("click", function () {
    S.sound = S.sound === false;
    save(); applySound();
    if (S.sound !== false && window.SFX) SFX.tap();

  function setMode(m) {
    mode = m;
    document.querySelectorAll(".modes .mode").forEach(function (b) {
      b.classList.toggle("on", b.dataset.m === m);
    });
    el.questHead.hidden = m !== "quest";
    el.dailyHead.hidden = m !== "daily";
    el.trainPanel.hidden = m !== "quest";

    var ov = document.querySelector(".ov"); if (ov) ov.remove();

  function startDaily() {
    run = null;
    el.resume.hidden = true;
    fillBoard(srng(dailySeed()));
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(dailyKey()) || "null"); } catch (e) {}
    daily = { left: DAILY_SEC, score: 0, over: false };
    var d = new Date();
    el.dDate.textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일의 낱말";
    if (saved) {
      found = (saved.found || []).filter(function (w) { return answers.indexOf(w) >= 0; });
      daily.score = saved.score || 0;
      daily.over = true;

      drawAll(); tickDaily();
      showDaily(true);

    drawAll(); tickDaily();

  function tickDaily() {
    el.dTimer.textContent = daily.left;
    el.dTimer.classList.toggle("low", daily.left <= 15);
    var fc = foundCount();
    el.dFound.textContent = fc;
    el.dTotal.textContent = answers.length;
    el.dScore.textContent = daily.score.toLocaleString();

  }

  function endDaily() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    daily.over = true;
    try {
      localStorage.setItem(dailyKey(), JSON.stringify({ found: found, score: daily.score }));
    } catch (e) {}
    var k = todayKey();
    S.best[k] = Math.max(S.best[k] || 0, daily.score);
    save(); drawAll(); tickDaily();
    if (window.SFX) { foundCount() >= answers.length ? SFX.win() : SFX.lose(); }
    showDaily(false);
  }

  // 공유 글.
  //
  // 처음에는 워들처럼 초록/노랑/흰 네모를 한 줄로 늘어놓았는데, 읽은 사람이
  // 색을 거꾸로 해석했다. 워들에서 노랑은 "글자는 맞지만 자리가 틀렸다"는
  // 뜻이라, 여기서도 "네 답은 반만 맞다"로 읽힌다. 이 게임에는 반만 맞는
  // 낱말이라는 개념이 아예 없으므로 그 색을 쓰면 안 된다.
  //
  // 그래서 범례가 필요 없는 모양으로 바꿨다. 줄마다 글자 수를 적어두면
  // 색이 무슨 뜻인지 묻지 않아도 되고, 빈 네모는 "못 찾은 칸"으로만 읽힌다.
  //  4글자 🟪  3글자 🟦  2글자 🟩  못 찾음 ⬜
  var BLK = { 4: "\ud83d\udfea", 3: "\ud83d\udfe6", 2: "\ud83d\udfe9", 0: "\u2b1c" };

  // 등급. 점수보다 칭호가 먼저 입에 붙는다 — 공유를 만드는 건 숫자가 아니라
  // 자랑할 이름이다.
  function rank(ratio) {
    return ratio >= 1    ? "낱말 신선"
         : ratio >= 0.8  ? "낱말 용사"
         : ratio >= 0.6  ? "낱말 무사"
         : ratio >= 0.35 ? "낱말 수련생"
         :                 "낱말 초심자";
  }

  // 글자 수별로 줄을 나눈 결과표. 화면과 공유 글이 같은 자료를 쓴다.
  function shareRows() {
    var by = {};
    answers.forEach(function (w) {
      var L = Math.min(4, Math.max(2, w.length));
      (by[L] = by[L] || { got: 0, all: 0 }).all++;
      if (found.indexOf(w) >= 0) by[L].got++;
    });
    return [4, 3, 2].filter(function (L) { return by[L]; }).map(function (L) {
      var r = by[L], line = "";
      for (var i = 0; i < r.all; i++) line += i < r.got ? BLK[L] : BLK[0];
      return { len: L, got: r.got, all: r.all, blocks: line };
    });
  }

  function shareText() {
    var d = new Date();
    var ratio = answers.length ? foundCount() / answers.length : 0;
    var body = shareRows().map(function (r) {
      return r.len + "글자 " + r.blocks + "  " + r.got + "/" + r.all;
    }).join("\n");
    return "낱말 용사 · 오늘의 낱말 " + (d.getMonth() + 1) + "." + d.getDate() + "\n"
      + "\ud83c\udfc5 " + rank(ratio) + "\n\n"
      + body + "\n\n"
      + "찾은 낱말 " + foundCount() + "/" + answers.length
      + " · " + daily.score.toLocaleString() + "점 · 수련 " + trainLv() + "단\n\n"
      + "같이 풀어요 \u25b6 " + location.href.split("#")[0] + "#daily";
  }

  function showDaily(already) {
    var ov = document.createElement("div");
    ov.className = "ov";
    var card = document.createElement("div");
    card.className = "card";

    var ratio = answers.length ? foundCount() / answers.length : 0;

    // 오늘 받은 칭호를 낙관처럼 찍는다. 점수보다 이게 먼저 보여야 한다.

    card.appendChild(h);

    // 색이 무슨 뜻인지 화면에서 한 번은 말해 준다. 공유 글에는 줄마다
    // 글자 수가 적혀 있어 이 줄이 필요 없다.
    var lg = document.createElement("p");
    lg.className = "lead legend";
    lg.textContent = "색칠된 칸은 찾은 낱말, 빈 칸은 못 찾은 낱말입니다";
    card.appendChild(lg);

    var det = document.createElement("details");
    det.className = "shbox";
    var sum = document.createElement("summary");
    sum.textContent = "카톡에 붙여넣을 내용 보기";
    det.appendChild(sum);
    var sh = document.createElement("div");
    sh.className = "share";
    sh.textContent = shareText();
    det.appendChild(sh);
    card.appendChild(det);

    var row = document.createElement("div");
    row.className = "row";
    var cp = document.createElement("button");
    cp.className = "btn go";
    cp.textContent = "결과 복사하기";
    cp.addEventListener("click", function () {
      var t = shareText();
      var done = function () { cp.textContent = "복사됨 · 카톡에 붙여넣으세요"; };
      try {
        navigator.clipboard.writeText(t).then(done, function () {
          var r = document.createRange(); r.selectNodeContents(sh);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          cp.textContent = "직접 복사해 주세요";
        });
      } catch (e) { cp.textContent = "직접 복사해 주세요"; }
    });
    row.appendChild(cp);
    card.appendChild(row);

    var miss = answers.filter(function (w) { return found.indexOf(w) < 0; }).slice(0, 12);
    if (miss.length) {
      var mt = document.createElement("p"); mt.className = "lead"; mt.textContent = "못 찾은 낱말";
      card.appendChild(mt);
      var ms = document.createElement("div"); ms.className = "missed";
      miss.forEach(function (w) { var x = document.createElement("span"); x.textContent = w; ms.appendChild(x); });
      card.appendChild(ms);
    }

    var back = document.createElement("button");
    back.className = "btn";
    back.textContent = "모험으로 돌아가기";
    back.addEventListener("click", function () { ov.remove(); setMode("quest"); });
    card.appendChild(back);

    var reset = document.createElement("button");
    reset.className = "btn";
    reset.style.fontSize = "12px";
    reset.textContent = "오늘 기록 지우기 (시연용)";
    reset.addEventListener("click", function () {
      try { localStorage.removeItem(dailyKey()); } catch (e) {}
      ov.remove(); startDaily();
    });
    card.appendChild(reset);

    ov.appendChild(card);
    document.body.appendChild(ov);
  }

  var toastT = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { t.remove(); }, 2600);
  }

  function requestWord(w) {
    if (window.SFX) SFX.bad();
    if (!S.asked) S.asked = [];
    if (S.asked.indexOf(w) < 0) S.asked.push(w);
    save();
    toast("“" + w + "” 등록 요청 접수 — 검수 후 반영됩니다");
    picked = [];
    drawAll();
  }

  function drawStats() {
    var cap = upCap();
    el.lv.textContent = "수련 " + trainLv() + "단";
    el.lv.title = "세 강화 단계의 평균 · 붓끝 " + S.atk + " / 먹물 " + S.time
      + " / 인장 " + S.combo + " (각 " + cap + "단계까지)";
    el.gold.textContent = S.gold;
    el.gem.textContent = S.gem;
    el.rToday.textContent = S.best[todayKey()] || 0;
    el.rWeek.textContent = weekTotal();
    el.rStage.textContent = S.bestStage;
    el.ups.textContent = "";
    UPGRADES.forEach(function (u) {
      var lvl = S[u.id], cost = Math.round(u.base * Math.pow(u.r, lvl));
      var maxed = lvl >= cap;
      var fails = S.fails[u.id] || 0;
      var p = successRate(lvl, fails);
      var row = document.createElement("div");
      row.className = "up";
      var left = document.createElement("div");
      var t = document.createElement("div"); t.className = "t";
      t.textContent = u.t + " · " + lvl + " / " + cap + "단계";
      var d = document.createElement("div"); d.className = "d"; d.textContent = u.desc(S);
      var pr = document.createElement("div");
      pr.className = "d rate" + (maxed ? "" : p >= 0.8 ? " hi" : p >= 0.5 ? " mid" : " lo");
      pr.textContent = maxed
        ? "이 회차의 최고 단계입니다"
        : "성공률 " + Math.round(p * 100) + "%"
          + (fails ? "  ·  연속 실패 " + fails + "회 보정 +" + (fails * 10) + "%p" : "");
      left.appendChild(t); left.appendChild(d); left.appendChild(pr);
      var b = document.createElement("button");
      b.textContent = maxed ? "완성" : "냥 " + cost;
      b.disabled = maxed || S.gold < cost;
      b.addEventListener("click", function () {
        if (maxed || S.gold < cost) return;
        S.gold -= cost;
        if (Math.random() < p) {
          S[u.id] = lvl + 1;
          S.fails[u.id] = 0;
          if (window.SFX) SFX.up();
          toast("강화 성공 — " + u.t.split(" ")[0] + " " + (lvl + 1) + "단계");
        } else {
          S.fails[u.id] = fails + 1;
          if (window.SFX) SFX.down();
          toast("강화 실패 — 단계는 그대로입니다 · 다음 성공률 "
                + Math.round(successRate(lvl, fails + 1) * 100) + "%");
        }
        save(); drawStats();
      });
      row.appendChild(left); row.appendChild(b);
      el.ups.appendChild(row);
    });
  }

  function drawAll() {
    drawTiles(); drawSlot(); drawStats();
    if (!playing()) el.poolCount.innerHTML = "글자판 대기";
    else {
      var rest = remaining();
      if (!rest.length) el.poolCount.innerHTML = "<b>모두 찾았습니다</b>";
      else {
        var by = {};
        rest.forEach(function (w) { by[w.length] = (by[w.length] || 0) + 1; });
        el.poolCount.innerHTML = "남은 낱말 " + Object.keys(by).sort().map(function (k) {
          return k + "글자 <b>" + by[k] + "</b>";
        }).join(" · ");
      }
    }
    el.found.textContent = "";
    found.forEach(function (w) {
      var s = document.createElement("span"); s.textContent = w; el.found.appendChild(s);
    });
    if (mode === "daily" && daily) tickDaily();
    var n = (S.asked || []).length;
    el.askedLine.textContent = n
      ? "내가 등록 요청한 낱말 " + n + "개 — " + S.asked.slice(-6).join(", ")
      : "";
  }

  // ── 전투 ────────────────────────────────────────────────────────────
  function damageOf(w, idxs) {
    var atkMul = Math.pow(ATK_STEP, S.atk);
    var comboMul = 1 + Math.min(run ? run.combo : 0, COMBO_CAP) * (0.12 + S.combo * COMBO_STEP);
    var len = Math.pow(w.length, 1.75);
    var d = 12 * len * atkMul * comboMul;
    // 수호신전에서만 붙는 보정. 일반 단계는 지금까지와 똑같다.
    if (run && run.boss && run.boss.boss) {
      // 두 글자로 밀어붙이는 전법을 막는다. 폭주하면 거의 흘려보낸다.
      if (w.length === 2) d *= run.phase >= 2 ? 0.55 : 0.75;
      // 약점을 짚으면 크게 들어간다 — 이게 혈투의 활로다
      if (weakHit(idxs || picked)) d *= 1.8;
      // 마지막 15%는 결정타 구간. 끝을 질질 끌지 않게 한다.
      if (run.phase >= 3) d *= 1.4;
    }
    return Math.round(d);
  }

  // ── 수호신전 ────────────────────────────────────────────────────────
  // 10단계는 숫자만 큰 적이 아니라 국면이 바뀌는 싸움이어야 한다.
  //  1국면(100~50%) 약점 글자 하나, 두 글자 낱말 30% 감소
  //  2국면(50~15%)  폭주 — 글자판이 뒤집히고, 기세를 초당 1%씩 되찾고,
  //                 약점이 둘로 늘고, 손이 멈추면 포효로 연속이 끊긴다
  //  3국면(15~0%)   결정타 — 회복이 멈추고 공격이 1.4배로 들어간다
  var RAGE_REGEN = 0.010;   // 폭주 중 초당 회복(최대 기세 대비)
  var ROAR_IDLE = 10;       // 이 초만큼 손이 멈추면 연속이 끊긴다

  function weakHit(idxs) {
    if (!run || !run.weak || !run.weak.length) return false;
    for (var i = 0; i < run.weak.length; i++) {
      if (idxs.indexOf(run.weak[i]) >= 0) return true;
    }
    return false;
  }

  function pickWeak() {
    if (!run) return;
    if (!run.boss.boss) { run.weak = []; return; }
    var pool = [];
    for (var i = 0; i < board.length; i++) if (picked.indexOf(i) < 0) pool.push(i);
    pool.sort(function () { return Math.random() - 0.5; });
    run.weak = pool.slice(0, run.phase >= 2 ? 2 : 1);
    run.weakAt = run.left;
  }

  function phaseOf(r) {
    if (!r.boss.boss) return 1;
    var p = r.hp / r.max;
    return p <= 0.15 ? 3 : p <= 0.50 ? 2 : 1;
  }

  function applyPhase() {
    if (!run) return;
    var np = phaseOf(run);
    if (np === run.phase) return;
    run.phase = np;
    if (np === 2) {
      if (window.SFX) SFX.rage();
      toast(run.boss.n + "이 폭주합니다 — 기세를 되찾기 시작합니다");
      // 폭주의 첫 수는 글자판을 뒤흔드는 것. 외워둔 수가 통하지 않는다.
      picked = [];
      board.sort(function () { return Math.random() - 0.5; });
      computeAnswers();
    } else if (np === 3) {
      if (window.SFX) SFX.final();
      toast("결정타 — 지금은 공격이 크게 들어갑니다");
    }
    pickWeak();
    paintBoss();
  }

  function paintBoss() {
    if (!run) return;
    var b = run.boss, rage = b.boss && run.phase >= 2;
    el.portrait.className = "portrait g-" + b.grade
      + (b.boss ? " boss p" + run.phase : "");
    el.rage.hidden = !rage;
    el.rage.textContent = run.phase >= 3 ? "결정타" : "폭주";
    el.rage.className = "rage" + (run.phase >= 3 ? " fin" : "");
    document.body.classList.toggle("raging", !!rage);
  }

  function stageInfo(stage) {
    var loop = Math.floor(stage / 100), k = stage % 100;
    var M = MOUNTAINS[Math.floor(k / 10)], sub = k % 10;
    var boss = sub === 9;
    return {
      n: boss ? M.n + " 수호신" : TITLES[sub] + M.n,
      base: M.n,
      grade: boss ? "guard" : sub < 3 ? "young" : sub < 6 ? "base" : "angry",
      m: M.m, boss: boss, no: k + 1, loop: loop,
      hp: Math.round(150 * Math.pow(1.07, k) * (boss ? 3.0 : 1) * Math.pow(4, loop)),
      t: (boss ? 70 : 45) + S.time * TIME_STEP,
      hint: boss ? "두 글자는 거의 통하지 않습니다 · 금빛 글자를 노리세요"
                 : (k < HINTS.length ? HINTS[k] : "")
    };
  }

  function startStage() {
    var b = stageInfo(S.stage);
    run = { boss: b, hp: b.hp, max: b.hp, left: b.t, combo: 0, score: 0, words: [],
            phase: 1, weak: [], weakAt: b.t, regen: 0, lastHit: b.t };
    picked = [];
    fillBoard();
    pickWeak();
    // 그려진 신수가 있으면 그림을, 아직 없으면 코드 렌더러를 쓴다
    var art = ART[b.base];
    paintBoss();
    el.pimg.hidden = !art;
    el.sigil.hidden = !!art;
    if (art) el.pimg.src = "art/" + art + ".jpg";
    else if (window.Sinsu) window.Sinsu.draw(el.sigil, b.base, b.grade);
    el.bossName.textContent = b.n;
    el.bossHint.textContent = b.hint;
    el.mtName.textContent = b.m;
    el.stageNo.textContent = b.no;
    el.cycle.textContent = b.loop ? "· " + (b.loop + 1) + "회차" : "";
    el.hpMax.textContent = b.hp;
    el.resume.hidden = true;
    tick();
    drawAll();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(onSecond, 1000);
  }

  var timerId = null;
  function onSecond() {
    if (mode === "daily") {
      if (!daily || daily.over) return;
      daily.left--;
      if (daily.left <= 0) { daily.left = 0; tickDaily(); endDaily(); return; }
      tickDaily();
      return;
    }
    if (!run) return;
    run.left--;
    if (run.left <= 0) { run.left = 0; tick(); finish(false); return; }
    if (run.boss.boss) bossSecond();
    tick();
  }

  function bossSecond() {
    // 약점은 가만히 두지 않는다. 폭주하면 더 빨리 옮겨 다닌다.
    if (run.weakAt - run.left >= (run.phase >= 2 ? 6 : 9)) pickWeak();

    if (run.phase !== 2) { el.hp.classList.remove("regen"); return; }

    // 폭주 중 회복. 2국면 상한(50%)을 넘기지 않는다 — 넘기면 국면이
    // 되돌아가 플레이어가 상황을 읽을 수 없게 된다.
    run.regen += run.max * RAGE_REGEN;
    var back = Math.floor(run.regen);
    if (back >= 1) {
      run.regen -= back;
      var cap = Math.round(run.max * 0.50);
      var before = run.hp;
      run.hp = Math.min(cap, run.hp + back);
      if (run.hp > before) {
        el.hp.classList.add("regen");
        setTimeout(function () { el.hp.classList.remove("regen"); }, 420);
      }
    }
    // 손이 멈추면 포효가 연속을 끊는다. 쉬면서 이기는 싸움이 아니다.
    if (run.combo > 0 && run.lastHit - run.left >= ROAR_IDLE) {
      run.combo = 0;
      run.lastHit = run.left;
      if (window.SFX) SFX.roar();
      toast(run.boss.n + "의 포효 — 연속이 끊겼습니다");
      drawAll();
    }
  }

  function tick() {
    if (!run) return;
    el.timer.textContent = run.left;
    el.timer.classList.toggle("low", run.left <= 10);
    el.hp.style.width = Math.max(0, (run.hp / run.max) * 100) + "%";
    el.hpNow.textContent = Math.max(0, run.hp);
  }

  function tap(i) {
    if (!playing() || picked.indexOf(i) >= 0) return;
    if (picked.length >= 4) return;
    picked.push(i);
    if (window.SFX) SFX.tap();
    drawAll();
  }

  function floatDmg(n, kind) {
    var d = document.createElement("div");
    d.className = "dmg" + (kind ? " " + kind : "");
    d.textContent = (kind === "weak" ? "약점! -" : "-") + n;
    d.style.left = (18 + Math.random() * 40) + "%";
    d.style.top = "46%";
    el.floaters.appendChild(d);
    setTimeout(function () { d.remove(); }, 1000);
  }

  // 모드마다 '지금 플레이 중인가'의 조건이 다르다. 한 군데로 모은다.
  function playing() {
    return mode === "daily" ? !!(daily && !daily.over) : !!run;
  }

  function foundCount() {
    return found.filter(function (w) { return answers.indexOf(w) >= 0; }).length;
  }

  function attack() {
    var w = currentWord();
    if (!accepted(w) || found.indexOf(w) >= 0) return;
    if (mode === "daily") {
      if (!daily || daily.over) return;
      found.push(w);
      var pts = Math.round(10 * Math.pow(w.length, 1.9));
      daily.score += pts;
      floatDmg(pts);
      if (window.SFX) SFX.word(w.length);
      picked = [];
      drawAll();
      if (!remaining().length) endDaily();
      return;
    }
    if (!run || !accepted(w) || found.indexOf(w) >= 0) return;
    found.push(w);
    var wasWeak = run.boss.boss && weakHit(picked);
    var shrug = run.boss.boss && w.length === 2;
    var dmg = damageOf(w);
    run.hp -= dmg;
    run.combo++;
    run.score += dmg;
    run.words.push(w);
    run.lastHit = run.left;
    floatDmg(dmg, wasWeak ? "weak" : shrug ? "weak-no" : "");
    if (window.SFX) {
      SFX.word(w.length);
      if (wasWeak) SFX.weak(); else if (shrug) SFX.guard(); else SFX.hit();
    }
    el.portrait.classList.add("hit");
    setTimeout(function () { el.portrait.classList.remove("hit"); }, 110);
    picked = [];
    if (wasWeak) pickWeak();   // 짚힌 비늘은 닫힌다
    // 글자판을 다 털면 보너스를 주고 새 글자를 깐다
    if (!remaining().length) {
      var bonus = Math.round(dmg * 0.8);
      run.hp -= bonus; run.score += bonus;
      floatDmg(bonus);
      if (window.SFX) SFX.clear();
      toast("글자판을 모두 찾았습니다 · 보너스 +" + bonus);
      fillBoard();
      pickWeak();
    }
    if (run.hp <= 0) { tick(); drawAll(); finish(true); return; }
    applyPhase();
    tick();
    drawAll();
  }

  function finish(won) {
    if (timerId) { clearInterval(timerId); timerId = null; }
    document.body.classList.remove("raging");
    el.rage.hidden = true;
    el.hp.classList.remove("regen");
    var r = run; run = null;
    var reward = 0;
    if (won) {
      // 단수는 장식이 아니라 수입이다. 고르게 올린 사람이 더 번다.
      reward = Math.round((25 + r.max * 0.24) * (1 + trainLv() * 0.05));
      S.gold += reward;
      S.stage++;
      S.bestStage = Math.max(S.bestStage, S.stage + 1);
    }
    var k = todayKey();
    S.best[k] = Math.max(S.best[k] || 0, r.score);
    save();
    el.fightLabel.textContent = stageInfo(S.stage).no + "단계";
    el.resume.hidden = false;
    drawAll();
    if (window.SFX) { won ? SFX.win() : SFX.lose(); }
    overlay(won, r, reward);
  }

  // ── 기록 ────────────────────────────────────────────────────────────
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function weekTotal() {
    var sum = 0, now = new Date();
    for (var i = 0; i < 7; i++) {
      var d = new Date(now.getTime() - i * 86400000);
      var k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      sum += S.best[k] || 0;
    }
    return sum;
  }

  // ── 결과 / 과금 접점 ────────────────────────────────────────────────
  function overlay(won, r, reward) {
    var ov = document.createElement("div");
    ov.className = "ov";
    var card = document.createElement("div");
    card.className = "card";

    var h = document.createElement("h2");
    h.className = won ? "win" : "lose";
    h.textContent = won ? r.boss.n + ", 물러나다" : "해가 저물었습니다";
    card.appendChild(h);

    var big = document.createElement("div");
    big.className = "big";
    big.textContent = r.score.toLocaleString();
    card.appendChild(big);

    var lead = document.createElement("p");
    lead.className = "lead";
    lead.textContent = won
      ? "낱말 " + r.words.length + "개 · 획득 냥 " + reward
      : r.boss.n + "의 기세가 " + Math.max(0, r.hp) + " 남았습니다";
    card.appendChild(lead);

    if (r.words.length) {
      var ws = document.createElement("div");
      ws.className = "words";
      r.words.slice(-10).forEach(function (w) {
        var s = document.createElement("span"); s.textContent = w; ws.appendChild(s);
      });
      card.appendChild(ws);
    }

    // 못 찾은 낱말을 공개한다. 정답을 숨기면 "이게 왜 안 돼"가 남지만,
    // 보여주면 "아 그게 있었구나"가 되고 어휘를 하나 배워 간다.
    var miss = remaining().slice(0, 10);
    if (miss.length) {
      var mt = document.createElement("p");
      mt.className = "lead";
      mt.textContent = "이 글자판에 있었던 낱말";
      card.appendChild(mt);
      var ms = document.createElement("div");
      ms.className = "missed";
      miss.forEach(function (w) {
        var s = document.createElement("span"); s.textContent = w; ms.appendChild(s);
      });
      card.appendChild(ms);
    }

    var row = document.createElement("div");
    row.className = "row";

    if (!won) {
      // 과금 접점 1 — 부활. 리뷰에서 가장 많이 욕먹는 자리라 가장 정직해야 한다.
      var rev = document.createElement("button");
      rev.className = "btn";
      rev.innerHTML = "이어하기<span class='sub'>옥 20</span>";
      rev.disabled = S.gem < 20;
      rev.addEventListener("click", function () {
        S.gem -= 20; save(); ov.remove();
        run = { boss: r.boss, hp: r.hp, max: r.max, left: 20, combo: 0, score: r.score, words: r.words };
        picked = []; fillBoard(); tick(); drawAll();
        timerId = setInterval(onSecond, 1000);
      });
      row.appendChild(rev);

      var ad = document.createElement("button");
      ad.className = "btn";
      ad.innerHTML = "광고 보고 이어하기<span class='sub'>30초 · 시뮬</span>";
      ad.addEventListener("click", function () {
        ov.remove();
        run = { boss: r.boss, hp: r.hp, max: r.max, left: 20, combo: 0, score: r.score, words: r.words };
        picked = []; fillBoard(); tick(); drawAll();
        timerId = setInterval(onSecond, 1000);
      });
      row.appendChild(ad);
    } else {
      var next = document.createElement("button");
      next.className = "btn go";
      next.textContent = "다음 산으로";
      next.addEventListener("click", function () { ov.remove(); startStage(); });
      row.appendChild(next);
    }
    card.appendChild(row);

    var again = document.createElement("button");
    again.className = "btn";
    again.textContent = won ? "수련하러 가기" : "다시 도전";
    again.addEventListener("click", function () {
      ov.remove();
      if (!won) startStage();
      else { drawAll(); window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }
    });
    card.appendChild(again);

    ov.appendChild(card);
    document.body.appendChild(ov);
  }

  // 과금 접점 2 — 힌트
  el.btnHint.addEventListener("click", function () {
    if (!playing() || S.gem < 5) return;
    // 남은 것 중 가장 긴 낱말을 알려준다. 플레이어가 가장 찾기 어려워하는
    // 것이고 데미지도 가장 크다. 옥 5개가 아깝지 않아야 또 쓴다.
    var rest = remaining().sort(function (a, b) { return b.length - a.length; });
    if (!rest.length) return;
    var w = rest[0];
    S.gem -= 5; save();
    picked = [];
    for (var i = 0; i < w.length; i++) {
      for (var j = 0; j < board.length; j++) {
        if (board[j].ch === w[i] && picked.indexOf(j) < 0) { picked.push(j); break; }
      }
    }
    drawAll();
  });

  document.querySelectorAll(".modes .mode").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.m); });
  });

  el.btnFight.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
    startStage();
  });

  // 한 글자씩만 지운다. 낱말이 최대 네 글자라 네 번이면 다 비워지므로
  // '전체 지우기'는 따로 둘 값어치가 없다. 꾹 누르기는 발견되지 않는
  // 제스처이고, 주 타깃 연령대에서는 더더욱 쓰이지 않는다.
  // 가운데 글자만 빼고 싶으면 슬롯의 그 글자를 직접 누르면 된다.
  el.btnClear.addEventListener("click", function () {
    if (!picked.length) return;
    picked.pop();
    if (window.SFX) SFX.tap();
    drawAll();
  });
  el.btnGo.addEventListener("click", function () {
    var w = currentWord();
    if (accepted(w)) attack();
    else if (w.length >= 2) requestWord(w);
  });
  // 섞기는 순서만 바꾼다 — 정답 집합은 그대로다
  el.btnShuffle.addEventListener("click", function () {
    if (!playing()) return;
    picked = [];
    board.sort(function () { return Math.random() - 0.5; });
    pickWeak();
    drawAll();
  });
  // 정말 막혔을 때만. 공짜면 계속 눌러 넘기게 되니 시간을 받는다
  el.btnNew.addEventListener("click", function () {
    if (mode === "daily") { toast("오늘의 낱말은 글자판이 고정입니다"); return; }
    if (!run) return;
    run.left = Math.max(1, run.left - 5);
    fillBoard();
    tick(); drawAll();
  });

  // 키보드로도 — PC에서 심사·시연할 때 필요하다
  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !el.btnGo.disabled) { attack(); e.preventDefault(); }
    if (e.key === "Backspace" && picked.length) { picked.pop(); drawAll(); e.preventDefault(); }
    if (e.key === "Escape") { picked = []; drawAll(); }
  });

  var hot = window.claude && window.claude.hot;
  function boot() {
    applySound();
    // 공유 링크(#daily)로 들어오면 바로 오늘의 낱말부터 보여준다
    if ((location.hash || "").toLowerCase() === "#daily") setMode("daily");
    else { drawAll(); startStage(); }
  }
  if (hot && hot.snapshot) hot.snapshot(function () { return { s: S }; });
  if (hot && hot.ready) hot.ready(boot); else boot();
})();
</script>
